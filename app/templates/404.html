{% extends "base.html" %}

{% block content %}
    <div class="min-h-screen flex items-center justify-center px-4 py-12 sm:px-6 lg:px-8">
        <div class="text-center">
            <!-- Larger 404 Heading -->
            <h2 class="text-9xl sm:text-[10rem] font-extrabold text-red-600 mb-6">404</h2>
            
            <!-- Subheading Size -->
            <h3 class="text-3xl font-semibold text-gray-800 mb-6">Page Not Found</h3>
            
            <!-- Body text size -->
            <p class="text-lg text-gray-600 mb-8 max-w-xl mx-auto">Sorry, the page you are looking for doesn't exist. Please check the URL or go back to the homepage.</p>
            
            <!-- Button Size -->
            <a href="/" class="px-8 py-4 text-lg text-white bg-blue-600 rounded-lg hover:bg-blue-700 transition duration-300">Back to Home</a>
        </div>
    </div>
{% endblock %}
